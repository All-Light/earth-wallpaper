<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#02050c"><title>Earth wallpaper</title></head><body><main id="app"><img id="snapshot" alt="Earth at the current time"><div id="rendererMount"></div><div id="gestureSurface" aria-label="Wake Earth and orbit"></div><div class="scene-vignette"></div><div class="clock" id="clock"><time id="time"></time><span id="date"></span></div><button class="orb-button" id="menuButton" aria-label="Open settings" aria-expanded="false"><span></span><span></span><span></span></button><aside class="panel" id="panel" hidden><header><strong>Settings</strong><button id="closePanel" aria-label="Close settings">×</button></header><label class="switch"><span>Satellite clouds <small id="cloudStatus">Loading…</small></span><input id="cloudToggle" type="checkbox"><i></i></label><label class="switch"><span>Clock</span><input id="clockToggle" type="checkbox"><i></i></label><label class="switch"><span>Stars</span><input id="starsToggle" type="checkbox"><i></i></label><label class="range">Return to home <select id="returnDelay"><option value="20">After 20 seconds</option><option value="45">After 45 seconds</option><option value="90">After 90 seconds</option><option value="0">Off</option></select></label><label class="range">Quality <select id="quality"><option value="high">High</option><option value="balanced">Balanced</option><option value="low">Low power</option></select></label><div class="bookmark"><button id="saveHome">Save current view as return location</button><button id="resetHome">Reset Rome</button></div><p class="attribution">NASA Earth imagery · Contains modified EUMETSAT data.<br>Cloud feed updates ~3 hourly; polar coverage is estimated.</p><footer><span id="status">Sleeping</span><span>H hide · F fullscreen</span></footer></aside><div class="error" id="error" hidden><span id="errorMessage"></span> <button id="retryButton">Retry</button></div></main><script type="module" src="/src/shell.js"></script></body></html>
